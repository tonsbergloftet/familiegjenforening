<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Mottak – Familiegjenforening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Mottak for teknisk eier: én vei gjennom, fire steg, kontroll i hvert steg. Samme uttrykk som redaktøren. */
:root{color-scheme:light dark;
--bg:light-dark(#F7F5F1,#0f1a20);--sheet:light-dark(#ffffff,#16242c);--sunk:light-dark(#F1EDE6,#121f26);
--ink:light-dark(#1C2E3A,#e4ecef);--muted:light-dark(#5F6A70,#9fb0b8);--line:light-dark(#E7E3DC,#26363f);
--navy:light-dark(#013952,#bcd9e8);--green:light-dark(#00714e,#5cc79a);--on-green:light-dark(#ffffff,#0b1a14);
--mint:light-dark(#EEF4E8,#18302a);--warn:light-dark(#FFF3D1,#3a3018);--warn-ink:light-dark(#5C4300,#f0d78f);
--err:light-dark(#FDE8E6,#3a1d1b);--err-ink:light-dark(#8A1F14,#f4b2a9);--shadow:0 1px 3px rgba(1,57,82,.07),0 4px 12px rgba(1,57,82,.04)}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Barlow',system-ui,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent);outline-offset:2px}
.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,2vw);background:var(--sheet);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--navy);white-space:nowrap}
.brand::before{content:'';width:4px;height:22px;border-radius:2px;background:var(--green)}
.brand small{font-weight:500;color:var(--muted);font-size:14px}
.stepper{display:flex;gap:6px;margin-inline-start:auto;list-style:none;padding:0;margin-block:0}
.stepper li{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted);padding:4px 10px 4px 4px;border-radius:999px}
.stepper li b{display:grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--sunk);font-size:13px}
.stepper li.now{color:var(--navy);background:var(--mint);font-weight:600}.stepper li.now b{background:var(--green);color:var(--on-green)}
.stepper li.done b{background:var(--mint);color:var(--green)}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 90px}
.lead{color:var(--muted);margin:4px 0 0}
h1{font-size:28px;line-height:1.2;color:var(--navy);margin:8px 0 4px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:22px;margin:16px 0;box-shadow:var(--shadow)}
.card.locked{opacity:.5}.card.locked>*:not(h2){display:none}
.card h2{display:flex;align-items:center;gap:10px;font-size:21px;color:var(--navy);margin:0 0 8px}
.card h2 .n{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sunk);font-size:15px;flex:none}
.card.ok h2 .n{background:var(--green);color:var(--on-green)}
.card h3{font-size:17px;margin:18px 0 6px}
p{margin:6px 0}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600;background:var(--mint);color:var(--green)}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.ghost{background:transparent;color:var(--navy);text-decoration:underline;text-underline-offset:3px}
.btn.small{min-height:34px;padding:5px 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.acts{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0 4px}
.msg{border-radius:12px;padding:10px 14px;margin:8px 0;font-size:15px;overflow-wrap:anywhere}
.msg.ok{background:var(--mint);color:var(--green)}.msg.warn{background:var(--warn);color:var(--warn-ink)}.msg.err{background:var(--err);color:var(--err-ink)}
.msg ul{margin:4px 0 0;padding-inline-start:20px}
.msg b{font-weight:700}
.hint{font-size:14.5px;color:var(--muted)}
.drop{border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--green);background:var(--mint)}
table{border-collapse:collapse;width:100%;font-size:15px;margin:8px 0}
th,td{text-align:start;padding:6px 8px;border-bottom:1px solid var(--line)}th{font-weight:600;color:var(--muted);font-size:14px}
.ch{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.ch .lbl{font-weight:600;font-size:15px}
.ch .was{color:var(--muted);text-decoration:line-through;white-space:pre-wrap;font-size:15px;margin-top:4px}
.ch .now{white-space:pre-wrap;font-size:15px;margin-top:4px;background:var(--mint);border-radius:8px;padding:4px 8px}
.ch.conf{border-color:var(--warn-ink)}
.ch label{display:flex;gap:8px;align-items:center;font-size:15px;margin-top:6px}
.tag{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:1px 9px;margin-inline-start:6px;vertical-align:1px}
.tag.ny{background:var(--mint);color:var(--green)}.tag.endret{background:var(--sunk);color:var(--navy)}.tag.slettet{background:var(--err);color:var(--err-ink)}.tag.konflikt{background:var(--warn);color:var(--warn-ink)}
.lcard{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0}
.lcard.done{background:var(--mint);border-color:transparent}
.lhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lhead b{font-size:18px}
.pill{font-size:13px;font-weight:600;border-radius:999px;padding:2px 10px;margin-inline-start:auto}
.pill.g{background:var(--green);color:var(--on-green)}.pill.y{background:var(--warn);color:var(--warn-ink)}.pill.r{background:var(--err);color:var(--err-ink)}
textarea{width:100%;min-height:130px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--sunk);font:14px/1.45 ui-monospace,Menlo,Consolas,monospace}
.iss{font-size:14.5px;border-top:1px solid var(--line);padding:8px 0}
.iss .src,.iss .tr{white-space:pre-wrap;border-radius:8px;padding:6px 10px;margin:6px 0;background:var(--sheet);color:var(--ink)}.iss .src{color:var(--muted)}.iss .src::before,.iss .tr::before{content:attr(data-l);display:block;font:600 12.5px Barlow,sans-serif;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.files{font:14px/1.6 ui-monospace,Menlo,Consolas,monospace}
.files li.new::after{content:' (ny fil)';color:var(--green);font-family:'Barlow',sans-serif}
pre.commit{white-space:pre-wrap;background:var(--sunk);border-radius:12px;padding:12px 14px;font:14px/1.5 ui-monospace,Menlo,Consolas,monospace;margin:8px 0}
ol.todo{padding-inline-start:22px}ol.todo li{margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row label{display:flex;flex-direction:column;font-size:14px;font-weight:600;gap:4px}
.row input,.row select{border:1px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--sheet);min-height:42px}
details summary{cursor:pointer;font-weight:600;color:var(--navy)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--sheet);padding:10px 18px;border-radius:999px;opacity:0;transition:.2s;pointer-events:none;font-weight:600}
.toast.show{opacity:1;transform:translateX(-50%)}
[dir=rtl]{text-align:right}
@media (max-width:760px){.stepper li span{display:none}.stepper li{padding:4px}.brand small{display:none}.card{padding:16px}}
</style>
</head>
<body>
<header class="top"><div class="brand">Mottak <small>Familiegjenforening · for teknisk eier</small></div><ol class="stepper" id="stepper"></ol></header>
<main class="wrap">
  <h1>Legg inn endringer</h1>
  <p class="lead">Verktøyet tar deg gjennom fire steg og kontrollerer alt før noe lagres. Til slutt laster du opp på github.com, og verktøyet kontrollerer at opplastingen ble riktig.</p>
  <div id="app"></div>
</main>
<input type="file" id="fileInput" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status"></div>
<script>
(()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clone=o=>JSON.parse(JSON.stringify(o));
const isRtl=l=>['ar','fa','prs','ckb','ps','ur','he'].includes(l);
const PACK=25,MAXW=80;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2400)}
async function copy(txt,msg){try{await navigator.clipboard.writeText(txt);toast(msg||'Kopiert')}catch(e){const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();toast(msg||'Kopiert')}}
async function sha10(s){const b=await crypto.subtle.digest('SHA-1',new TextEncoder().encode(s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,10)}
// Samme fingeravtrykk som redaktøren bruker i «grunnlag»
const fingerprint=(s,t)=>{const j=JSON.stringify({s,t});return j.length+':'+[...j].reduce((h,c)=>(h*31+c.charCodeAt(0))|0,0)};

// ───────── Tilstand ─────────
let R=null;          // siste versjon: {files:{sti:tekst}, data, repo, commit}
let VERIFIED=null,VMSG='';
let E=null,EN='';    // endringsfil og filnavn
let K=null,KN='',KA=null; // kontrollfil fra tolk
let AN=null,SD=[];   // analyse av tekster og struktur
let CHOICE={};       // konflikter: 'redaktor' | 'behold'
let NL=null;         // nytt språk {kode,navn,retning,status}
let N=null,REMOVED=[],CHANGED=new Set(); // ny data etter steg 2
let JOBS={};         // per språk: {keys, acc:{}, warn:{}, iss:{}, forced:{}, note}
let SAVED=null;      // resultat av lagring
let PUB=null;        // sammenligning med publisert versjon

// ───────── Lese og skrive data ─────────
const SPRAK_RE=/^sprak\/([a-z-]+)\.json$/,STATUS_RE=/^sprak\/([a-z-]+)\.status\.json$/,UI_RE=/^ui\/([a-z-]+)\.json$/;
const wanted=p=>/^(config|struktur)\.json$/.test(p)||SPRAK_RE.test(p)||STATUS_RE.test(p)||UI_RE.test(p);
function toData(files){
  const J=p=>{if(files[p]==null)throw new Error(`Fant ikke data/${p}.`);try{return JSON.parse(files[p])}catch(e){throw new Error(`${p} inneholder en feil og kan ikke leses (${e.message}). Rett fila på github.com, eller gå tilbake til forrige versjon (se README).`)}};
  const d={config:J('config.json'),struktur:J('struktur.json'),sprak:{},status:{},ui:{}};
  for(const p of Object.keys(files)){let m;if(m=p.match(STATUS_RE))d.status[m[1]]=J(p);else if(m=p.match(SPRAK_RE))d.sprak[m[1]]=J(p);else if(m=p.match(UI_RE))d.ui[m[1]]=J(p)}
  return d;
}
function toFiles(d){
  const f={'config.json':d.config,'struktur.json':d.struktur};
  for(const l in d.sprak)f['sprak/'+l+'.json']=d.sprak[l];
  for(const l in d.status)f['sprak/'+l+'.status.json']=d.status[l];
  for(const l in d.ui)f['ui/'+l+'.json']=d.ui[l];
  for(const k in f)f[k]=JSON.stringify(f[k],null,2)+'\n';
  return f;
}
const same=(a,b)=>{try{return JSON.stringify(JSON.parse(a))===JSON.stringify(JSON.parse(b))}catch(e){return a===b}};

// Henter siste versjon direkte fra GitHub (riktig commit, ingen mellomlagring).
// Går det ikke, brukes den publiserte versjonen på nettsiden.
const pathsFor=cfg=>['config.json','struktur.json',...(cfg.sprak||[]).flatMap(l=>['sprak/'+l.kode+'.json','ui/'+l.kode+'.json',...(l.kode==='no'?[]:['sprak/'+l.kode+'.status.json'])])];
async function latestCommit(repo){
  const r=await fetch(`https://api.github.com/repos/${repo}/commits/main`,{cache:'no-store',headers:{Accept:'application/vnd.github+json'}});
  if(!r.ok)throw new Error('GitHub svarte '+r.status);const c=await r.json();
  return{sha:c.sha,date:c.commit.committer.date,msg:c.commit.message.split('\n')[0],who:c.commit.author.name};
}
async function fetchFiles(base,cfgText){
  const get=async p=>{const r=await fetch(base+p,{cache:'no-store'});if(r.status===404)return null;if(!r.ok)throw new Error(`Kunne ikke hente ${p} (${r.status}).`);return r.text()};
  const c=cfgText??await get('config.json');if(c==null)throw new Error('Fant ikke data/config.json.');
  let cfg;try{cfg=JSON.parse(c)}catch(e){throw new Error('config.json inneholder en feil og kan ikke leses.')}
  const files={'config.json':c};
  await Promise.all(pathsFor(cfg).filter(p=>p!=='config.json').map(async p=>{const t=await get(p);if(t!=null)files[p]=t}));
  return files;
}
const rawBase=(repo,sha)=>`https://raw.githubusercontent.com/${repo}/${sha}/data/`;
let ERR1='',LOADING=false;
async function load(){
  LOADING=true;ERR1='';R=null;resetFrom(2);render();
  try{
    const cfgText=await fetch('data/config.json',{cache:'no-cache'}).then(r=>{if(!r.ok)throw new Error('Fant ikke data/config.json. Mottaket må åpnes fra nettsiden.');return r.text()});
    const repo=JSON.parse(cfgText).github;let commit=null,files,note='';
    if(repo){try{commit=await latestCommit(repo);files=await fetchFiles(rawBase(repo,commit.sha))}catch(e){commit=null;note=e.message}}
    if(!files)files=await fetchFiles('data/',cfgText);
    R={files,data:toData(files),repo,commit,note};
  }catch(e){ERR1=e.message;R=null}
  LOADING=false;render();
}
// Kontroll etter opplasting: henter siste commit og sammenligner filene med det mottaket laget
async function verifyUpload(){
  const out={set innerHTML(h){VMSG=h;render()}};out.innerHTML='<div class="msg">Henter siste versjon fra GitHub …</div>';
  try{
    const c=await latestCommit(R.repo);
    if(R.commit&&c.sha===R.commit.sha){out.innerHTML='<div class="msg warn">Finner ingen ny opplasting ennå. Har du trykket <b>Commit changes</b>? Prøv igjen om litt.</div>';return}
    const base=rawBase(R.repo,c.sha),bad=[],missing=[];
    await Promise.all(SAVED.paths.map(async p=>{const r=await fetch(base+p,{cache:'no-store'});if(r.status===404){missing.push(p);return}const t=await r.text();if(!same(t,SAVED.files[p]))bad.push(p)}));
    if(!bad.length&&!missing.length){VERIFIED=c;out.innerHTML=`<div class="msg ok"><b>Opplastingen er riktig.</b> Alle ${SAVED.paths.length} filene ligger på GitHub slik mottaket laget dem («${esc(c.msg)}», ${esc(c.sha.slice(0,7))}). Appen er oppdatert om 1–2 minutter.</div>`;return}
    out.innerHTML=`<div class="msg err"><b>Opplastingen stemmer ikke.</b>${missing.length?`<br>Mangler på GitHub: ${missing.map(p=>'data/'+esc(p)).join(', ')}. Har du dratt inn mappa <code>data</code>, og ikke mappa rundt den?`:''}${bad.length?`<br>Annet innhold enn forventet: ${bad.map(p=>'data/'+esc(p)).join(', ')}. Last opp disse filene på nytt fra zip-fila.`:''}<br>Siste opplasting: «${esc(c.msg)}» av ${esc(c.who)}.</div>`;
  }catch(e){out.innerHTML=`<div class="msg err">Kunne ikke kontrollere: ${esc(e.message)}. Sjekk på GitHub at filene er lastet opp.</div>`}
}
// Enkel zip uten komprimering
function crc32(u){let c=-1;for(let i=0;i<u.length;i++){c^=u[i];for(let k=0;k<8;k++)c=c&1?(c>>>1)^0xEDB88320:c>>>1}return(c^-1)>>>0}
function zip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0,n=0;
  for(const [p,t] of Object.entries(files)){n++;const name=enc.encode(p),data=enc.encode(t),crc=crc32(data);
    const l=new DataView(new ArrayBuffer(30));[[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[12,0x21,2],[14,crc,4],[18,data.length,4],[22,data.length,4],[26,name.length,2]].forEach(([o,v,s])=>s===4?l.setUint32(o,v,true):l.setUint16(o,v,true));
    const c=new DataView(new ArrayBuffer(46));[[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[14,0x21,2],[16,crc,4],[20,data.length,4],[24,data.length,4],[28,name.length,2],[42,off,4]].forEach(([o,v,s])=>s===4?c.setUint32(o,v,true):c.setUint16(o,v,true));
    parts.push(l,name,data);cen.push(c,name);off+=30+name.length+data.length}
  const size=cen.reduce((s,x)=>s+x.byteLength,0),e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,n,true);e.setUint16(10,n,true);e.setUint32(12,size,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cen,e],{type:'application/zip'});
}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

// ───────── Navn og kontroll ─────────
const LIST={sporsmal:'sporsmal',fase:'faser',punkt:'punkter',kontakt:'kontakter'};
const FIELD={tittel:'tittel',naar:'«Når og for hvem»',tekst:'tekst',kort:'kort navn',undertekst:'undertekst',navn:'navn',info:'beskrivelse',ja:'svaret «ja»',nei:'svaret «nei»'};
const KIND={sporsmal:'Spørsmål',fase:'Fase',punkt:'Punkt',kontakt:'Kontakt'};
function titleOf(type,id,...nos){const k=type==='punkt'||type==='fase'?type+'.'+id+'.tittel':type==='kontakt'?'kontakt.'+id+'.navn':'sporsmal.'+id+'.tekst';for(const no of nos)if(no&&no[k])return no[k];return id}
function label(k,...nos){
  if(k.startsWith('ui.'))return 'Fast tekst i appen: '+k.slice(3);
  const m=k.match(/^(sporsmal|fase|punkt|kontakt)\.([^.]+)\.(.+)$/);if(!m)return k;
  return `${KIND[m[1]]} «${titleOf(m[1],m[2],...nos)}» – ${FIELD[m[3]]||m[3]}`;
}
const belongs=(k,S)=>{const m=k.match(/^(sporsmal|fase|punkt|kontakt)\.([^.]+)\./);return !!m&&(S[LIST[m[1]]]||[]).some(x=>x.id===m[2])};
const words=s=>String(s||'').replace(/[«»–-]/g,' ').trim().split(/\s+/).filter(Boolean).length;
const langName=(d,l)=>((d.config.sprak||[]).find(x=>x.kode===l)||{}).navn||l;

function validate(d){
  const err=[],warn=[],S=d.struktur||{},no=d.sprak.no||{};
  if(!d.sprak.no)err.push('Fila sprak/no.json mangler.');
  for(const arr of ['sporsmal','faser','punkter','kontakter']){
    if(!Array.isArray(S[arr])){err.push(`struktur.json mangler lista «${arr}».`);S[arr]=[];continue}
    const seen=new Set();S[arr].forEach(x=>{if(!x.id||!/^[a-z0-9-]+$/.test(x.id))err.push(`Ugyldig ID i ${arr}: «${x.id}». Bruk små bokstaver a–z, tall og bindestrek.`);if(seen.has(x.id))err.push(`ID-en «${x.id}» er brukt to ganger i ${arr}.`);seen.add(x.id)})}
  const F=new Set(S.faser.map(f=>f.id)),K=new Set(S.kontakter.map(k=>k.id)),Q=Object.fromEntries(S.sporsmal.map(q=>[q.id,q.svar||['nei','ja']]));
  const need=[];
  S.sporsmal.forEach(q=>need.push(`sporsmal.${q.id}.tekst`,`sporsmal.${q.id}.ja`,`sporsmal.${q.id}.nei`));
  S.faser.forEach(f=>{need.push(`fase.${f.id}.kort`,`fase.${f.id}.tittel`);if(!S.punkter.some(p=>p.fase===f.id))warn.push(`Fasen «${titleOf('fase',f.id,no)}» har ingen punkter og vises ikke.`)});
  S.punkter.forEach(p=>{const n=`«${titleOf('punkt',p.id,no)}»`;need.push(`punkt.${p.id}.tittel`,`punkt.${p.id}.tekst`);
    if(!F.has(p.fase))err.push(`Punktet ${n} hører til en fase som ikke finnes («${p.fase}»).`);
    (p.kontakter||[]).forEach(k=>{if(!K.has(k))err.push(`Punktet ${n} viser til en kontakt som ikke finnes («${k}»).`)});
    (p.vises_hvis||[]).forEach(v=>{const [a,b]=String(v).split('=');if(!Q[a]||!Q[a].includes(b))err.push(`Punktet ${n} har et vilkår som ikke stemmer med spørsmålene: «${v}».`)});
    if(p.lenke&&!/^https:\/\/\S+$/.test(p.lenke))warn.push(`Lenken i punktet ${n} ser ikke riktig ut: ${p.lenke}`);
    if(!['publisert','utkast'].includes(p.status))err.push(`Punktet ${n} har ukjent status «${p.status}». Bruk publisert eller utkast.`);
    if(words(no[`punkt.${p.id}.tekst`])>MAXW)warn.push(`Punktet ${n} har ${words(no[`punkt.${p.id}.tekst`])} ord. Anbefalt maks er ${MAXW}.`)});

function stepK(){
  const l=K.sprak,nav=langName(R.data,l),no=R.data.sprak.no,g=KA.rows.filter(r=>r.godkjent),f=KA.rows.filter(r=>r.ny!=null),c=KA.rows.filter(r=>r.conf);
  let b=`<div class="msg ok">Kontrollfil fra tolk: <b>${esc(KN)}</b>, ${esc(nav)}${K.laget?`, laget ${esc(new Date(K.laget).toLocaleString('nb-NO',{dateStyle:'medium',timeStyle:'short'}))}`:''}. <button class="btn ghost small" id="clearE">Bytt fil</button></div>`;
  if(!KA.rows.length)b+=`<div class="msg warn">${KA.done?'Alt i denne fila er allerede lagt inn.':'Ingenting i fila kan tas i bruk.'} Det er ingenting nytt å publisere.</div>`;
  else b+=`<div class="msg ok"><b>${g.length}</b> tekster blir merket som kontrollert, og <b>${f.length}</b> blir rettet.${KA.done?` ${KA.done} var allerede lagt inn.`:''}</div>`;
  if(KA.skip.length)b+=`<div class="msg warn"><b>${KA.skip.length} ${KA.skip.length===1?'tekst':'tekster'} blir ikke tatt med.</b> De er fortsatt merket «Maskinoversatt», og tolken ser dem igjen neste gang.<ul>${KA.skip.map(x=>`<li>${esc(label(x.k,no))}: ${esc(x.m)}</li>`).join('')}</ul></div>`;
  if(c.length)b+=`<div class="msg warn"><b>${c.length===1?'1 oversettelse':c.length+' oversettelser'} er endret av andre siden tolken så på dem.</b> Velg hvilken versjon som skal gjelde.</div>`;
  if(f.length)b+=`<h3>Rettet av tolken (${f.length})</h3>`+f.map(r=>`<div class="ch ${r.conf?'conf':''}"><div class="lbl">${esc(label(r.k,no))}${r.godkjent?'<span class="tag ny">Godkjent</span>':'<span class="tag endret">Ikke godkjent</span>'}${r.conf?'<span class="tag konflikt">Konflikt</span>':''}</div><div class="was" dir="auto">${esc(r.cur??'(mangler)')}</div><div class="now" dir="auto">${esc(r.ny)}</div>${r.iss.length?`<div class="hint">${esc(r.iss.map(i=>i.m).join(' '))}</div>`:''}${r.conf?`<label><input type="radio" name="c-${esc(r.k)}" value="tolk" ${CHOICE[r.k]!=='behold'?'checked':''} data-choice="${esc(r.k)}"> Bruk tolkens tekst</label><label><input type="radio" name="c-${esc(r.k)}" value="behold" ${CHOICE[r.k]==='behold'?'checked':''} data-choice="${esc(r.k)}"> Behold teksten som står på GitHub nå</label>`:''}</div>`).join('');
  const only=g.filter(r=>r.ny==null);
  if(only.length)b+=`<details><summary>Godkjent uten endring (${only.length})</summary><ul>${only.map(r=>`<li>${esc(label(r.k,no))}</li>`).join('')}</ul></details>`;
  return b;
}
function step2(){
  const locked=!R||validate(R.data).err.length>0;let b='';
  if(!locked){
    b+=`<p>Legg inn endringsfila fra redaktøren eller kontrollfila fra en tolk. Du ser alt som endres før noe skjer.</p>`;
    if(K)b+=stepK();
    else if(!E)b+=`<div class="drop" id="drop">Slipp <b>endringer-….json</b> eller <b>kontroll-….json</b> her, eller <button class="btn small" id="pickFile">velg fil</button></div><div id="e2"></div>`;
    else{
      b+=`<div class="msg ok">Endringsfil: <b>${esc(EN)}</b>${E.laget?`, laget ${esc(new Date(E.laget).toLocaleString('nb-NO',{dateStyle:'medium',timeStyle:'short'}))}`:''}. <button class="btn ghost small" id="clearE">Bytt fil</button></div>`;
      const fp=fingerprint(R.data.struktur,R.data.sprak.no),total=AN.nye.length+AN.endret.length+AN.slettet.length;
      if(E.eldre_utkast)b+=`<div class="msg warn"><b>Redaktøren jobbet videre på et eldre utkast.</b> Se nøye gjennom endringene under, så ingenting blir tilbakestilt ved en feil.</div>`;
      if(E.grunnlag&&E.grunnlag!==fp&&E.struktur)b+=`<div class="msg warn"><b>Innholdet er endret siden redaktøren lastet ned fila.</b> Endringsfila erstatter hele strukturen (faser, punkter og kontakter). Sjekk listen over strukturendringer under. Er noe feil, be redaktøren åpne redaktørverktøyet på nytt og laste ned en ny fil.</div>`;
      if(!total&&!SD.length)b+=`<div class="msg warn">Alt i denne fila er allerede lagt inn. Det er ingenting nytt å publisere.</div>`;
      if(AN.konflikt.length)b+=`<div class="msg warn"><b>${AN.konflikt.length===1?'1 tekst':AN.konflikt.length+' tekster'} er endret av andre siden redaktøren lastet ned fila.</b> Velg hvilken versjon som skal gjelde for hver av dem.</div>`;
      const no=R.data.sprak.no,nn=E.tekster;
      const row=(k,kind)=>{const conf=AN.konflikt.includes(k);return`<div class="ch ${conf?'conf':''}"><div class="lbl">${esc(label(k,nn,no))}<span class="tag ${kind}">${{ny:'Ny',endret:'Endret',slettet:'Slettes'}[kind]}</span>${conf?'<span class="tag konflikt">Konflikt</span>':''}</div>${kind!=='ny'?`<div class="was">${esc(no[k])}</div>`:''}${kind!=='slettet'?`<div class="now">${esc(nn[k])}</div>`:''}${/\.tekst$/.test(k)&&k.startsWith('punkt.')&&words(nn[k])>MAXW?`<div class="hint">${words(nn[k])} ord. Anbefalt maks er ${MAXW}.</div>`:''}${conf?`<label><input type="radio" name="c-${esc(k)}" value="redaktor" ${CHOICE[k]!=='behold'?'checked':''} data-choice="${esc(k)}"> Bruk redaktørens tekst</label><label><input type="radio" name="c-${esc(k)}" value="behold" ${CHOICE[k]==='behold'?'checked':''} data-choice="${esc(k)}"> Behold teksten som står på GitHub nå</label>`:''}</div>`};
      if(total)b+=`<h3>Tekster (${total})</h3>`+AN.endret.map(k=>row(k,'endret')).join('')+AN.nye.map(k=>row(k,'ny')).join('')+AN.slettet.map(k=>row(k,'slettet')).join('');
      if(SD.length)b+=`<h3>Struktur (${SD.length})</h3>`+SD.map(s=>`<div class="msg ${s.t==='slettet'||s.t==='viktig'?'warn':'ok'}">${esc(s.m)}</div>`).join('')+(SD.some(s=>s.t==='viktig')?'<p class="hint">Telefonnumre vises for familiene på alle språk. Sjekk at det nye nummeret stemmer.</p>':'');
    }
    if(K){}else if(NL)b+=`<div class="msg ok">Nytt språk: <b>${esc(NL.navn)}</b> (${esc(NL.kode)}, ${NL.retning==='rtl'?'høyre til venstre':'venstre til høyre'}). ${NL.status==='publisert'?'Vises for familiene med en gang, merket «Maskinoversatt».':'Lagres som utkast og vises bare med ?utkast=1.'} <button class="btn ghost small" id="clearNL">Fjern</button></div>`;
    else b+=`<details id="nlBox"><summary>Legge til et nytt språk</summary><p class="hint">Alle tekstene KI-oversettes i neste steg. Be så en tolk se over.</p><div class="row"><label>Språkkode<input id="nlKode" placeholder="f.eks. ti" size="6" maxlength="5"></label><label>Navn på eget språk<input id="nlNavn" placeholder="f.eks. ትግርኛ"></label><label>Skriveretning<select id="nlDir"><option value="ltr">Venstre til høyre</option><option value="rtl">Høyre til venstre</option></select></label><label>Vis for familiene<select id="nlStatus"><option value="publisert">Med en gang</option><option value="utkast">Senere (utkast)</option></select></label><button class="btn" id="nlAdd">Legg til</button></div><div id="nlErr"></div><p class="hint">Språkkoden er ISO 639-1, f.eks. so (somali), ti (tigrinja), uk (ukrainsk), fa (persisk).</p></details>`;
    if(N){const v=validate(N);b+=v.err.length?'':`<div class="msg ok">Kontrollert: endringene gir gyldige filer.</div>`}
    else if(E||NL||K){
      const preview=(()=>{const keep=N;buildN();const v=validate(N);N=keep;return v})();
      b+=msgList('err','Endringene gir feil som må rettes før de kan legges inn:',preview.err);
      const go=K?KA.rows.length>0:E?(AN.nye.length+AN.endret.length+AN.slettet.length+SD.length>0):false;
      b+=`<div class="acts"><button class="btn primary" id="apply" ${preview.err.length||(!go&&!NL)?'disabled':''}>${K?'Ta i bruk':'Ta i bruk og gå til oversettelse'}</button></div>`;
    } else b+=`<div class="acts"><button class="btn ghost" id="skipE">Jeg har ingen endringsfil, bare oversett det som mangler</button></div>`;
  }
  return card(2,'Se gjennom endringene',!!N,locked,b);
}
function step3(){
  const locked=!N;let b='';
  if(!locked){
    const L=Object.entries(JOBS).filter(([l,j])=>j.keys.length);
    if(!L.length)b+=`<div class="msg ok">Ingen tekster trenger oversettelse.</div>`;
    else{
      b+=`<p>Hvert språk må oversettes før du kan lagre. For hver pakke: <b>kopier</b>, lim inn i Copilot, ChatGPT eller Claude, og <b>lim svaret</b> inn i feltet under.</p><p class="hint">Store mengder deles opp i pakker på ${PACK} tekster. Da blir svarene sjeldnere kuttet.</p>`;
      L.forEach(([l,j])=>{
        const nav=langName(N,l),done=jobDone(j),left=j.keys.filter(k=>!(k in j.acc)),packs=[];for(let i=0;i<left.length;i+=PACK)packs.push(left.slice(i,i+PACK));
        const nIss=Object.keys(j.iss).length,nW=Object.keys(j.warn).length;
        b+=`<div class="lcard ${done?'done':''}"><div class="lhead"><b dir="auto">${esc(nav)}</b><span class="hint">${Object.keys(j.acc).length} av ${j.keys.length} tekster</span><span class="pill ${done?'g':nIss?'r':'y'}">${done?'Ferdig':nIss?nIss+' må rettes':'Venter på svar'}</span></div>`;
        if(!done){
          b+=`<div class="acts">${packs.map((p,i)=>`<button class="btn small" data-pack="${l}:${i}">Kopier ${packs.length>1?`pakke ${i+1} av ${packs.length}`:'pakken'} (${p.length})</button>`).join('')}</div>
          <textarea data-ta="${l}" placeholder="Lim inn svaret fra KI-verktøyet her" spellcheck="false" autocorrect="off" autocapitalize="off">${esc(j.ta)}</textarea>
          <div class="acts"><button class="btn primary small" data-apply="${l}">Kontroller og legg inn</button></div>`;
        }
        b+=j.note;
        if(nIss)b+=`<div class="msg err"><b>Disse er ikke lagt inn.</b> Be KI-verktøyet rette dem, og lim inn på nytt. Eller godta hvis du har sjekket at det er riktig.${Object.entries(j.iss).map(([k,x])=>`<div class="iss"><b>${esc(label(k,N.sprak.no))}</b><ul>${x.iss.map(i=>`<li>${esc(i.m)}</li>`).join('')}</ul><div class="src" data-l="Norsk">${esc(src(k))}</div><div class="tr" data-l="Oversettelse" dir="auto">${esc(x.v)}</div><button class="btn small" data-force="${l}|${esc(k)}">Godta likevel</button></div>`).join('')}</div>`;
        if(nW)b+=`<details><summary>Sjekk ${nW} tekster med merknader</summary>${Object.entries(j.warn).map(([k,iss])=>`<div class="iss"><b>${esc(label(k,N.sprak.no))}</b>: ${esc(iss.map(i=>i.m).join(' '))}<div class="src" data-l="Norsk">${esc(src(k))}</div><div class="tr" data-l="Oversettelse" dir="auto">${esc(j.acc[k])}</div></div>`).join('')}</details>`;
        b+=`</div>`;
      });
    }
  }
  return card(3,'KI-oversett til alle språk',allDone()&&!!N,locked,b);
}
function step4(){
  const locked=!allDone();let b='';
  if(!locked){
    if(!SAVED){
      b+=`<p>Alt er kontrollert. Siste kontroll kjøres når du laster ned.</p><div id="s4msg"></div><div class="acts"><button class="btn primary" id="save">Last ned filene som skal lastes opp</button></div>`;
    }else{
      const {title,body}=commitText(),up=R.repo?`https://github.com/${R.repo}/upload/main`:'';
      b+=`<div class="msg ok"><b>${esc(SAVED.zip)} er lastet ned.</b> Den inneholder mappa <code>data</code> med de ${SAVED.paths.length} filene som er endret.</div>
      <ol class="todo">
        <li><b>Pakk ut zip-fila.</b> Windows: høyreklikk og velg «Pakk ut alle». Mac: dobbeltklikk. Da får du en mappe som heter <code>data</code>.</li>
        <li><b>Åpne opplastingssiden på GitHub</b>${up?`: <a href="${esc(up)}" target="_blank" rel="noopener">${esc(up.replace('https://',''))}</a>`:' (Add file → Upload files)'}.</li>
        <li><b>Dra mappa <code>data</code> inn i feltet.</b> Ikke mappa rundt den. GitHub skal vise disse filene, og eksisterende filer blir erstattet:<ul class="files">${SAVED.paths.map(p=>`<li class="${SAVED.created.includes(p)?'new':''}">data/${esc(p)}</li>`).join('')}</ul></li>
        <li><b>Lim inn oppsummering og beskrivelse</b> under «Commit changes».<pre class="commit"><b>${esc(title)}</b>\n\n${esc(body)}</pre><div class="acts"><button class="btn small" id="cpT">Kopier oppsummering</button><button class="btn small" id="cpB">Kopier beskrivelse</button></div></li>
        <li>La «Commit directly to the main branch» være valgt, og trykk <b>Commit changes</b>.</li>
        <li><b>Kontroller opplastingen.</b> Verktøyet sjekker at filene på GitHub er nøyaktig de som ble laget her.${R.repo?`<div class="acts"><button class="btn primary" id="verify">Kontroller opplastingen</button></div><div id="verifyOut">${VMSG}</div>`:''}</li>
        <li>Åpne <a href="veileder.html${NL?'?lang='+NL.kode:''}" target="_blank" rel="noopener">appen</a> etter 1–2 minutter og se på det som er endret, gjerne på mobil. Gi redaktøren beskjed${Object.values(JOBS).some(j=>j.keys.length)?', og be en tolk kontrollere de nye oversettelsene':''}.</li></ol>
        <div class="acts"><button class="btn small" id="dlAgain">Last ned zip-fila igjen</button><button class="btn ghost" id="again">Start på nytt</button></div>`;
    }
  }
  return card(4,'Last opp på GitHub',!!VERIFIED,locked,b);
}
function bind(){
  const on=(s,ev,f)=>{const el=$(s);if(el)el[ev]=f};
  on('#reload','onclick',load);
  on('#verify','onclick',verifyUpload);
  on('#dlAgain','onclick',()=>download(SAVED.zip,SAVED.blob));
  on('#pickFile','onclick',()=>{$('#fileInput').value='';$('#fileInput').click()});
  const drop=$('#drop');if(drop){drop.ondragover=e=>{e.preventDefault();drop.classList.add('over')};drop.ondragleave=()=>drop.classList.remove('over');drop.ondrop=async e=>{e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f)takeFile(f)}}
  on('#clearE','onclick',()=>{E=null;EN='';AN=null;SD=[];K=null;KN='';KA=null;resetFrom(3);render()});
  on('#skipE','onclick',()=>{buildN();render();$('#s3').scrollIntoView({behavior:'smooth'})});
  on('#apply','onclick',()=>{buildN();render();$('#s3').scrollIntoView({behavior:'smooth'})});
  on('#clearNL','onclick',()=>{NL=null;resetFrom(3);render()});
  on('#nlAdd','onclick',()=>{
    const kode=$('#nlKode').value.trim().toLowerCase(),navn=$('#nlNavn').value.trim(),C=R.data.config;
    const e=!/^[a-z]{2,3}$/.test(kode)?'Språkkoden skal være 2–3 små bokstaver, f.eks. ti.':(C.sprak||[]).some(l=>l.kode===kode)?`Språket ${kode} finnes allerede.`:!navn?'Skriv navnet på språket, slik det skrives på språket selv.':'';
    if(e){$('#nlErr').innerHTML=`<div class="msg err">${esc(e)}</div>`;return}
    NL={kode,navn,retning:$('#nlDir').value,status:$('#nlStatus').value};resetFrom(3);render()});
  document.querySelectorAll('[data-choice]').forEach(r=>r.onchange=()=>{CHOICE[r.dataset.choice]=r.value});
  document.querySelectorAll('[data-ta]').forEach(t=>t.oninput=()=>{JOBS[t.dataset.ta].ta=t.value});
  document.querySelectorAll('[data-pack]').forEach(bt=>bt.onclick=()=>{
    const [l,i]=bt.dataset.pack.split(':'),j=JOBS[l],left=j.keys.filter(k=>!(k in j.acc)),packs=[];for(let x=0;x<left.length;x+=PACK)packs.push(left.slice(x,x+PACK));
    copy(prompt(l,langName(N,l),packs[+i],src,+i+1,packs.length),'Pakken er kopiert. Lim den inn i KI-verktøyet.')});
  document.querySelectorAll('[data-apply]').forEach(bt=>bt.onclick=()=>{const l=bt.dataset.apply;JOBS[l].ta=document.querySelector(`[data-ta="${l}"]`).value;applyAnswer(l);render();const c=document.querySelector(`[data-apply="${l}"]`)||document.querySelector('#s3');if(allDone())$('#s4').scrollIntoView({behavior:'smooth'})});
  document.querySelectorAll('[data-force]').forEach(bt=>bt.onclick=()=>{const [l,k]=bt.dataset.force.split('|'),j=JOBS[l],x=j.iss[k];j.acc[k]=x.v;j.forced[k]=x.iss.map(i=>i.m).join(' ');j.warn[k]=x.iss;delete j.iss[k];render()});
  on('#save','onclick',save);
  on('#cpT','onclick',()=>copy(commitText().title,'Oppsummeringen er kopiert'));
  on('#cpB','onclick',()=>copy(commitText().body,'Beskrivelsen er kopiert'));
  on('#again','onclick',()=>{scrollTo({top:0,behavior:'smooth'});load()});
}
async function takeFile(f){try{readChangeFile(await f.text(),f.name)}catch(e){const el=$('#e2');if(el)el.innerHTML=`<div class="msg err">${esc(e.message)}</div>`}}
$('#fileInput').onchange=e=>{const f=e.target.files[0];if(f)takeFile(f)};

async function save(){
  const btn=$('#save');btn.disabled=true;
  try{
    const d=await finalData(),v=validate(d);
    if(v.err.length){$('#s4msg').innerHTML=msgList('err','Siste kontroll fant feil. Ingenting er lastet ned:',v.err);btn.disabled=false;return}
    const files=toFiles(d),paths=Object.keys(files).filter(p=>R.files[p]==null||!same(R.files[p],files[p])),created=paths.filter(p=>R.files[p]==null);
    if(!paths.length){$('#s4msg').innerHTML='<div class="msg warn">Ingen filer er endret. Det er ingenting å laste opp.</div>';btn.disabled=false;return}
    const name='last-opp-'+new Date().toISOString().slice(0,10)+'.zip';
    SAVED={paths,created,files,zip:name,blob:zip(Object.fromEntries(paths.map(p=>['data/'+p,files[p]])))};
    download(name,SAVED.blob);render();$('#s4').scrollIntoView({behavior:'smooth'});
  }catch(e){$('#s4msg').innerHTML=`<div class="msg err">${esc(e.message)}</div>`;btn.disabled=false}
}
load();
})();
</script>

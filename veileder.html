<style>

<body>
<header class="top"><div class="wrap">
  <div class="muni" id="muni">Tønsberg kommune</div>
  <div class="lang-sw" id="langsw"></div>
</div></header>

  <footer class="foot">
    <div class="links" id="footLinks" hidden><button id="change"></button><button id="restart"></button></div>
    <span id="disc"></span><span id="proto"></span>
  </footer>
</div>
<style>
  .kc { background:#F4F1EB; border-radius:12px; padding:.75rem .875rem; margin-top:.75rem; }
  .kc b { display:block; color:var(--navy); }
  .kc span { display:block; color:var(--muted); font-size:.9375rem; }
  .kc a { display:inline-block; margin-top:.25rem; margin-inline-end:1rem; font-weight:600; color:var(--green-dark); }
  .body p + p, .body p + ul, .body ul + p { margin-top:.625rem; }
  .body ul { padding-inline-start:1.25rem; display:flex; flex-direction:column; gap:.3rem; margin-top:.5rem; }

  .callbox h3 { font-size:.8125rem; font-weight:600; color:var(--muted); margin-bottom:.25rem; }
  .vk { color:#923c3d; font-weight:600; }
  .mt { color:#3F6585; font-weight:500; }
  .startlink { display:inline-block; margin:-.5rem 0 1.25rem; font-weight:600; color:var(--navy); }

</style>
<script>
// ─────────────────────────────────────────────────────────────
// Familiegjenforeningsveileder – sjekklisten.
// Alt innhold hentes fra data/. Se README.md og DATAMODELL.md.
// ─────────────────────────────────────────────────────────────
{
const DATA_DIR = 'data/';
const params = new URLSearchParams(location.search);
const SHOW_DRAFTS = params.get('utkast') === '1';   // ?utkast=1 viser innhold med status «utkast»
let CFG, S, TX = {}, UI = {}, ST = {}, LANGS = [], NAMES = {}, DIR = {}, KEY = 'fgv_app_v1';
let state = { lang: null, svar: {}, answered: false, checked: {} }, phase = 0;

async function getJSON(path, optional) {
  const r = await fetch(DATA_DIR + path, { cache: 'no-cache' });
  if (!r.ok) { if (optional) return {}; throw new Error(path + ' (' + r.status + ')'); }
  try { return await r.json(); } catch (e) { throw new Error(path + ': ' + e.message); }
}
async function load() {
  CFG = await getJSON('config.json');
  S = await getJSON('struktur.json');
  KEY = CFG.lagringsnokkel || KEY;
  const langs = CFG.sprak.filter(l => l.status === 'publisert' || (SHOW_DRAFTS && l.status === 'utkast'));
  LANGS = langs.map(l => l.kode);
  langs.forEach(l => { NAMES[l.kode] = l.navn; DIR[l.kode] = l.retning || 'ltr'; });
  await Promise.all(LANGS.map(async l => {
    [TX[l], UI[l], ST[l]] = await Promise.all([getJSON('sprak/' + l + '.json'), getJSON('ui/' + l + '.json'), l === 'no' ? {} : getJSON('sprak/' + l + '.status.json', true)]);
  }));
}
function esc(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
const isRtl = l => DIR[l] === 'rtl';
const visible = x => x.status === 'publisert' || (SHOW_DRAFTS && x.status === 'utkast');
// Tekst på valgt språk, ellers norsk
const t = (k, l = state.lang || 'no') => (TX[l] && TX[l][k]) || (TX.no && TX.no[k]) || '';
const u = (k, l = state.lang || 'no') => (UI[l] && UI[l][k]) || (UI.no && UI.no[k]) || '';
const ltr = s => isRtl(state.lang) ? s.replace(/(\d[\d :.–-]*\d)/g, '<span dir="ltr">$1</span>') : s;
const fwd = () => isRtl(state.lang) ? '←' : '→', bwd = () => isRtl(state.lang) ? '→' : '←';

// Maskinoversatt: minst én tekst i punktet er ikke kontrollert av tolk (eller mangler og vises på norsk)
function machine(prefix) {
  if (state.lang === 'no') return false;
  const st = ST[state.lang] || {};
  return Object.keys(TX.no).filter(k => k.startsWith(prefix)).some(k => !TX[state.lang][k] || !st[k] || st[k].s !== 'kontrollert');
}
const anyMachine = () => state.lang !== 'no' && Object.keys(TX.no).some(k => { const s = (ST[state.lang] || {})[k]; return !s || s.s !== 'kontrollert'; });

// Teksten i et punkt: tomme linjer skiller avsnitt, «–» gir punktliste, en lang replikk i «…» gir boks
function body(s) {
  let h = '';
  String(s || '').split(/\n\s*\n/).forEach(block => {
    const ls = block.split('\n').map(x => x.trim()).filter(Boolean);
    if (!ls.length) return;
    if (ls.every(x => /^[–-]\s/.test(x))) { h += '<ul>' + ls.map(x => '<li>' + ltr(esc(x.replace(/^[–-]\s*/, ''))) + '</li>').join('') + '</ul>'; return; }
    ls.forEach(x => {
      const m = x.match(/^(.*?)«([^»]{26,})»(.*)$/);
      if (m) h += `<div class="callbox"><h3>${esc(u('liste.overskrift_replikk'))}</h3><p>${m[1].trim() ? ltr(esc(m[1].trim())) + ' ' : ''}«${esc(m[2])}»${esc(m[3])}</p></div>`;
      else if (/^[–-]\s/.test(x)) h += '<ul><li>' + ltr(esc(x.replace(/^[–-]\s*/, ''))) + '</li></ul>';
      else h += '<p>' + ltr(esc(x)) + '</p>';
    });
  });
  return h;
}
function contact(id) {
  const c = (S.kontakter || []).find(k => k.id === id);
  if (!c) return '';
  const tel = c.telefon ? `<a href="tel:${esc(c.telefon.replace(/\s/g, ''))}" dir="ltr">${esc(c.telefon)}</a>` : '';
  const web = c.nettside ? `<a href="${esc(c.nettside)}" target="_blank" rel="noopener" dir="ltr">${esc(c.nettside.replace(/^https?:\/\/(www\.)?/, '').replace(/\/$/, ''))}</a>` : '';
  return `<div class="kc"><b>${esc(t('kontakt.' + id + '.navn'))}</b><span>${ltr(esc(t('kontakt.' + id + '.info')))}</span>${tel}${web}</div>`;
}

// ── Tilstand (lagres bare på denne enheten) ──
function loadState() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s) {
      if (!s.svar) {   // overgang fra første versjon
        const yn = v => v === 'yes' ? 'ja' : v === 'no' ? 'nei' : undefined;
        s.svar = {}; if (s.arrived) s.svar.ankommet = yn(s.arrived); if (s.kids) s.svar.barn = yn(s.kids); if (s.housing) s.svar.bolig = yn(s.housing);
        delete s.arrived; delete s.kids; delete s.housing;
      }
      state = Object.assign(state, s);
    }
  } catch (e) {}
  if (LANGS.includes(params.get('lang'))) state.lang = params.get('lang');
  if (state.lang && !LANGS.includes(state.lang)) state.lang = null;
  save();
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
const condOk = x => (x.vises_hvis || []).every(c => { const [q, v] = c.split('='); return state.svar[q] === v; });

// ── Navigasjon: #sprak → #sporsmal → #liste ──
function route() {
  let r = location.hash.slice(1);
  if (!state.lang) return 'sprak';
  if (!['sprak', 'sporsmal', 'liste'].includes(r)) r = state.answered ? 'liste' : 'sporsmal';
  if (r === 'liste' && !state.answered) r = 'sporsmal';
  return r;
}
function go(r) { if (location.hash.slice(1) === r) render(); else location.hash = r; window.scrollTo(0, 0); }
function appUrl() { const x = new URL(location.href); x.hash = ''; x.search = '?lang=' + state.lang; return x.href; }
async function share(btn) {
  const url = appUrl(), label = btn.textContent;
  if (navigator.share) { try { await navigator.share({ title: u('start.tittel'), url }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  try { await navigator.clipboard.writeText(url); btn.textContent = u('felles.lenke_kopiert'); setTimeout(() => btn.textContent = label, 2000); } catch (e) { prompt('', url); }
}

function chrome(r) {
  const l = state.lang || 'no';
  document.documentElement.lang = l === 'no' ? 'nb' : l;
  document.documentElement.dir = isRtl(l) ? 'rtl' : 'ltr';
  document.title = u('start.tittel', l) + ' – ' + u('felles.kommune', l);
  document.getElementById('muni').textContent = u('felles.kommune', l);
  document.getElementById('disc').textContent = u('felles.ansvarsfraskrivelse', l) + ' ';
  document.getElementById('proto').textContent = u('felles.prototype', l);
  const sw = document.getElementById('langsw');
  sw.hidden = r === 'sprak';
  // Én tydelig knapp: jordklode + språket som er valgt. Fører til språkvalget.
  sw.innerHTML = `<button aria-label="${esc(u('sprakvalg.overskrift', l))}: ${esc(NAMES[l])}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 0 20M12 2a15 15 0 0 0 0 20"/></svg><span>${esc(NAMES[l])}</span></button>`;
  sw.querySelector('button').onclick = () => go('sprak');
  document.getElementById('footLinks').hidden = r !== 'liste';
  document.getElementById('change').textContent = u('liste.endre_svar', l);
  document.getElementById('restart').textContent = u('liste.start_paa_nytt', l);
}

function screenLang() {
  const a = l => `lang="${l === 'no' ? 'nb' : l}" dir="${isRtl(l) ? 'rtl' : 'ltr'}"`;
  return `<section class="langpick"><h1>${esc(u('sprakvalg.overskrift', 'no'))}</h1><p class="picks">` +
    LANGS.filter(l => l !== 'no').map(l => `<span ${a(l)}>${esc(u('sprakvalg.overskrift', l))}</span>`).join('') +
    `</p><div class="opts">` + LANGS.map(l => `<button class="opt" data-l="${l}" ${a(l)} aria-current="${l === state.lang}">${esc(NAMES[l])}</button>`).join('') + `</div></section>`;
}
function screenQuestions() {
  const qs = S.sporsmal.filter(visible), all = qs.every(q => state.svar[q.id]);
  return `<section class="welcome"><h1>${esc(u('start.tittel'))}</h1><p>${esc(u('start.ingress'))}</p>` +
    (CFG.viktigste_side ? `<a class="startlink" href="${esc(CFG.viktigste_side)}">${esc(u('start.viktigste'))} ${fwd()}</a>` : '') +
    (anyMachine() && u('felles.ki_merknad') ? `<p class="note">${esc(u('felles.ki_merknad'))}</p>` : '') +
    qs.map(q => `<div class="q"><h2>${esc(t('sporsmal.' + q.id + '.tekst'))}</h2><div class="opts">` +
      q.svar.map(v => `<button class="opt" data-k="${q.id}" data-v="${v}" aria-pressed="${state.svar[q.id] === v}">${esc(t('sporsmal.' + q.id + '.' + v))}</button>`).join('') + `</div></div>`).join('') +
    `<button class="start" id="start" ${all ? '' : 'disabled'}>${esc(u('sporsmal.knapp'))}</button><p class="testnote">${esc(u('start.test'))}</p></section>`;
}
function phases() {
  return S.faser.filter(f => visible(f) && condOk(f)).map(f => ({ ...f, items: S.punkter.filter(p => p.fase === f.id && visible(p) && condOk(p)) })).filter(f => f.items.length);
}
function screenList() {
  const P = phases(); if (phase >= P.length) phase = 0;
  const p = P[phase], allDone = p.items.every(it => state.checked[it.id]);
  let s = `<div class="toprow"><a class="back" href="#sporsmal">${bwd()} ${esc(u('liste.endre_svar'))}</a><button class="sharebtn" id="shareList">${esc(u('liste.del'))}</button></div><p class="sharehint">${esc(u('liste.del_hint'))}</p>`;
  if (anyMachine() && u('felles.ki_merknad')) s += `<p class="note">${esc(u('felles.ki_merknad'))}</p>`;
  s += `<nav class="tl" style="--n:${P.length}">` + P.map((x, i) => {
    const done = x.items.every(it => state.checked[it.id]);
    const cls = [x.fremhevet ? 'key' : '', done ? 'done' : '', i === phase ? 'active' : ''].join(' ');
    const dot = done && i !== phase ? '<svg width="12" height="10" viewBox="0 0 12 10"><path d="M1 5L4.5 8.5L11 1.5" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>' : (i + 1);
    return `<button class="${cls}" data-i="${i}"><span class="dot">${dot}</span><span class="lbl">${esc(t('fase.' + x.id + '.kort'))}</span></button>`;
  }).join('') + `</nav>`;
  s += `<div class="ph-head"><h2>${esc(t('fase.' + p.id + '.tittel'))}</h2><p>${esc(t('fase.' + p.id + '.undertekst'))}</p>${allDone ? `<p class="ph-done">${esc(u('liste.fase_ferdig'))}</p>` : ''}</div><div class="list">`;
  p.items.forEach(it => {
    const done = !!state.checked[it.id], k = f => 'punkt.' + it.id + '.' + f;
    let b = body(t(k('tekst'))) + (it.kontakter || []).map(contact).join('');
    if (it.lenke) b += `<p><a class="link" href="${esc(it.lenke)}" target="_blank" rel="noopener">${esc(u('liste.lenke'))} ${fwd()}</a></p>`;
    const meta = [done ? `<span class="badge done">${esc(u('merkelapp.done'))}</span>` : (it.viktig ? `<span class="vk">${esc(u('liste.viktig'))}</span>` : ''),
      t(k('naar')) ? `<span class="when">${ltr(esc(t(k('naar'))))}</span>` : '', machine('punkt.' + it.id + '.') ? `<span class="mt">${esc(u('liste.maskinoversatt'))}</span>` : ''].filter(Boolean).join('');
    s += `<details class="item${done ? ' done' : ''}" data-id="${it.id}"><summary>
        <button class="cb" aria-label="${esc(u('merkelapp.done'))}" aria-pressed="${done}"><svg width="12" height="9" viewBox="0 0 12 9"><path d="M1 4L4.5 7.5L11 1" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="meta"><div class="t">${esc(t(k('tittel')))}</div>${meta ? `<div class="sub">${meta}</div>` : ''}</div>
        <span class="chev" aria-hidden="true">▾</span></summary><div class="body">${b}</div></details>`;
  });
  s += `</div><div class="nav"><button id="prev" ${phase === 0 ? 'disabled' : ''}>${esc(u('liste.forrige'))}</button><button class="next" id="next" ${phase === P.length - 1 ? 'disabled' : ''}>${esc(u('liste.neste'))}</button></div>`;
  return s;
}

function render() {
  const r = route(); chrome(r);
  const el = document.getElementById('screen');
  if (r === 'sprak') {
    el.innerHTML = screenLang();
    el.querySelectorAll('[data-l]').forEach(b => b.onclick = () => { state.lang = b.dataset.l; save(); go(state.answered ? 'liste' : 'sporsmal'); });
  } else if (r === 'sporsmal') {
    el.innerHTML = screenQuestions();
    el.querySelectorAll('.opt').forEach(b => b.onclick = () => { state.svar[b.dataset.k] = b.dataset.v; save(); render(); });
    document.getElementById('start').onclick = () => { state.answered = true; phase = 0; save(); go('liste'); };
  } else {
    el.innerHTML = screenList();
    el.querySelectorAll('.tl button').forEach(b => b.onclick = () => { phase = +b.dataset.i; render(); });
    el.querySelectorAll('details.item').forEach(d => {
      const id = d.dataset.id;
      d.querySelector('.cb').onclick = e => { e.preventDefault(); e.stopPropagation(); if (state.checked[id]) delete state.checked[id]; else state.checked[id] = true; save(); render(); };
      d.querySelector('summary').onclick = e => { if (state.checked[id]) e.preventDefault(); };
    });
    document.getElementById('prev').onclick = () => { phase--; render(); window.scrollTo(0, 0); };
    document.getElementById('next').onclick = () => { phase++; render(); window.scrollTo(0, 0); };
    const sb = document.getElementById('shareList'); sb.onclick = () => share(sb);
  }
}

load().then(() => {
  loadState();
  addEventListener('hashchange', () => { render(); window.scrollTo(0, 0); });
  document.getElementById('change').onclick = () => go('sporsmal');
  document.getElementById('restart').onclick = () => {
    if (!confirm(u('liste.bekreft_start_paa_nytt'))) return;
    state = { lang: state.lang, svar: {}, answered: false, checked: {} }; save(); go('sporsmal');
  };
  render();
}).catch(err => {
  console.error(err);
  document.getElementById('screen').innerHTML = '<section class="welcome"><h1>Innholdet kunne ikke lastes</h1><p>Prøv igjen om litt. Hvis feilen fortsetter, kontakt den som har ansvaret for siden.</p><p class="note" lang="nb" dir="ltr">Teknisk feil: ' + esc(String(err.message || err)) + '</p></section>';
});
}
</script>
</body>
</html>

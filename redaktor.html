<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redaktør – Familiegjenforening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* VOICE calm, plain work tool for a non-technical editor – same family as the app
   IDEA the veileder opened up: the journey on the left, one card being written in the middle, the card on a phone on the right
   PICTURE the live phone preview with the journey timeline on top
   COLOUR warm paper, white sheets, Tønsberg navy, dark green for actions, sage highlights
   TYPE Barlow
   LAYOUT laptop: list | form | phone; tablet: list | form, preview by tab; phone: Innhold / Rediger / Forhåndsvis tabs */

:root{color-scheme:light dark;
--bg:light-dark(#F7F5F1,#0f1a20);--sheet:light-dark(#ffffff,#16242c);--sunk:light-dark(#F1EDE6,#121f26);
--ink:light-dark(#1C2E3A,#e4ecef);--muted:light-dark(#5F6A70,#9fb0b8);--line:light-dark(#E7E3DC,#26363f);
--navy:light-dark(#013952,#bcd9e8);--green:light-dark(#00714e,#5cc79a);--on-green:light-dark(#ffffff,#0b1a14);
--mint:light-dark(#EEF4E8,#18302a);--sage:light-dark(#c5daaf,#2c4a3c);--warn:light-dark(#FFF3D1,#3a3018);--warn-ink:light-dark(#5C4300,#f0d78f);
--draft:light-dark(#E6EEF3,#1d3340);--shadow:0 1px 3px rgba(1,57,82,.07),0 4px 12px rgba(1,57,82,.04)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 'Barlow',system-ui,sans-serif;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid color-mix(in srgb,var(--green) 55%,transparent);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
.top{display:flex;align-items:center;gap:12px;padding:10px max(16px,2vw);background:var(--sheet);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand::before{content:'';width:4px;height:22px;border-radius:2px;background:var(--green);flex:none}
.brand small{font-weight:500;color:var(--muted);font-size:14px}
.saved{margin-inline-start:auto;font-size:14px;color:var(--muted);white-space:nowrap}
.btn{border:0;border-radius:999px;padding:10px 18px;min-height:44px;font-weight:600;background:var(--mint);color:var(--green)}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.ghost{background:transparent;color:var(--navy)}
.btn:disabled{opacity:.45;cursor:default}
.count{display:inline-grid;place-items:center;min-width:22px;height:22px;border-radius:11px;background:var(--on-green);color:var(--green);font-size:13px;margin-inline-start:6px;padding:0 6px}
.main{display:grid;grid-template-columns:300px minmax(0,1fr) 400px;min-height:0}
.nav{border-inline-end:1px solid var(--line);overflow:auto;padding:14px 12px 40px;background:var(--bg)}
.hide-m{}
#pubBtn{white-space:nowrap}
@media (max-width:760px){.hide-m{display:none}}
.tut{position:fixed;inset:0;z-index:80;display:none}
.tut.on{display:block}
.tut-hole{position:fixed;border-radius:16px;box-shadow:0 0 0 9999px rgba(1,30,45,.66);outline:3px solid #FFD35C;outline-offset:0;transition:left .25s,top .25s,width .25s,height .25s;pointer-events:none}
.tut-card{position:fixed;background:var(--sheet);border-radius:18px;padding:20px 22px;width:min(380px,calc(100vw - 24px));box-shadow:0 20px 60px rgba(0,0,0,.35);transition:left .25s,top .25s}
.tut-card h2{margin:4px 0 8px;font-size:22px;color:var(--navy);line-height:1.2}
.tut-card p{margin:0;font-size:16px;line-height:1.55}
.tut-prog{display:flex;gap:5px;margin-bottom:12px}
.tut-prog span{height:5px;flex:1;border-radius:3px;background:var(--line)}
.tut-prog span.on{background:var(--green)}
.tut-num{display:flex;align-items:center;gap:8px;font-size:13.5px;font-weight:600;color:var(--muted)}
.navhead{position:sticky;top:-14px;z-index:3;background:var(--bg);margin:-14px -12px 6px;padding:14px 12px 6px;border-bottom:1px solid var(--line)}
.navhead .search{margin-bottom:4px}
.phead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 12px;color:var(--navy)}
.phead b{font-size:16px}
.phead small{font-size:13.5px;color:var(--muted);font-weight:500}
.pnum{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--navy);color:#fff;font-weight:700;font-size:14px;flex:none}
.edit .phead{position:sticky;top:-22px;z-index:3;background:var(--bg);margin:-22px calc(-1*clamp(16px,3vw,40px)) 16px;padding:14px clamp(16px,3vw,40px) 10px;border-bottom:1px solid var(--line)}
.prev .phead{position:sticky;top:-18px;z-index:3;background:var(--sunk);margin:-18px -20px 14px;padding:14px 20px 10px;border-bottom:1px solid var(--line)}
.vis{font-size:12.5px;font-weight:600;border-radius:999px;padding:2px 9px;margin-inline-start:6px;vertical-align:2px}
.vis.y{background:var(--mint);color:var(--green)}
.vis.n{background:var(--draft);color:var(--navy)}
.nodew{position:relative}
.nodew .node[aria-current=true]{padding-inline-end:78px}
.mv{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
.mv button{width:32px;height:30px;border:1px solid var(--line);background:var(--sheet);border-radius:8px;color:var(--navy);font-weight:700;font-size:15px}
.mv button:disabled{opacity:.3}
.bul{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.hiddennote{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--draft);border-radius:12px;padding:10px 14px;margin:0 0 14px;font-size:15px}
.search{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);font-size:16px;margin-bottom:10px}
.grp{margin:14px 0 4px;padding:0 8px;font-size:13px;font-weight:600;color:var(--muted)}
.navtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--sunk);border-radius:12px;padding:4px;margin:0 0 6px}
.navtabs button{border:0;background:transparent;border-radius:9px;padding:8px 4px;font-weight:600;font-size:14px;color:var(--muted);position:relative}
.navtabs button[aria-selected=true]{background:var(--sheet);color:var(--navy);box-shadow:var(--shadow)}
.navtabs button i{position:absolute;top:6px;inset-inline-end:8px;width:7px;height:7px;border-radius:50%;background:#E0A030}
.navdesc{font-size:13.5px;color:var(--muted);margin:4px 8px 8px;line-height:1.4}
.box.wide{width:min(820px,100%)}
.node{display:flex;align-items:center;gap:8px;width:100%;text-align:start;border:0;background:transparent;border-radius:10px;padding:8px 10px;min-height:40px;font-size:15px;color:var(--ink)}
.node:hover{background:var(--sunk)}
.node[aria-current=true]{background:var(--sheet);box-shadow:var(--shadow);font-weight:600;color:var(--navy)}
.node .lbl{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.node.phase{font-weight:600;color:var(--navy)}
.node.child{padding-inline-start:26px;font-size:14.5px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--green)}
.dot.utkast{background:transparent;box-shadow:inset 0 0 0 2px #7d9fb3}
.dot.skjult{background:#b9b2a6}
.dot.plain{background:var(--line)}
.flag{font-size:12px;font-weight:600;color:var(--warn-ink);background:var(--warn);border-radius:6px;padding:1px 6px;flex:none}
.chg{width:6px;height:6px;border-radius:50%;background:#e2a33b;flex:none}
.add{display:block;width:calc(100% - 26px);margin:2px 0 6px 26px;text-align:start;border:1px dashed var(--line);background:transparent;border-radius:10px;padding:7px 10px;font-size:14px;color:var(--green);font-weight:600}
.edit{overflow:auto;padding:22px clamp(16px,3vw,40px) 80px}
.crumb{font-size:14px;color:var(--muted);margin-bottom:4px}
h1{font-size:clamp(26px,3vw,34px);line-height:1.1;letter-spacing:-.02em;color:var(--navy);margin:0 0 14px;text-wrap:balance}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:7px 14px;min-height:38px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--sheet);color:var(--navy);box-shadow:var(--shadow)}
.mini{border:0;background:transparent;color:var(--navy);font-weight:600;font-size:14px;padding:8px 10px;border-radius:10px;min-height:40px}
.mini:hover{background:var(--sunk)}
.sec{background:var(--sheet);border-radius:18px;box-shadow:var(--shadow);padding:18px 20px 8px;margin-bottom:16px}
.sec h2{font-size:17px;margin:0 0 2px;color:var(--navy)}
.sec>p{margin:0 0 12px;font-size:14px;color:var(--muted)}
.f{margin-bottom:16px}
.fh{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.fh label{font-weight:600;font-size:15px;flex:1}
.qa{border:0;background:transparent;border-radius:8px;padding:4px 8px;font-size:13px;font-weight:600;color:var(--muted);min-height:32px}
.qa[aria-pressed=true]{background:var(--warn);color:var(--warn-ink)}
.fh .qa{display:none}
.f:hover .fh .qa,.f:focus-within .fh .qa,.fh .qa[aria-pressed=true]{display:inline-block}
.fh label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fh{flex-wrap:wrap;min-height:32px}
.f input[type=text],.f input[type=url],.f textarea,.f select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px;font-size:16px;line-height:1.45}
.f textarea{resize:vertical;min-height:48px;overflow:hidden}
.f input:focus,.f textarea:focus,.f select:focus{outline:0;border-color:var(--green);background:var(--sheet);box-shadow:0 0 0 3px color-mix(in srgb,var(--green) 18%,transparent)}
.hint{font-size:13.5px;color:var(--muted);margin-top:4px}
.stale{font-size:13.5px;color:var(--warn-ink);background:var(--warn);border-radius:8px;padding:4px 9px;margin-top:6px;display:inline-block}
.long{color:#b5562b}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:8px 14px;font-size:14.5px;min-height:40px}
.chip[aria-pressed=true]{background:var(--mint);border-color:var(--green);color:var(--green);font-weight:600}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;padding:6px 0}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--green)}
.ins{position:relative}
.menu{position:absolute;z-index:20;inset-inline-end:0;top:100%;background:var(--sheet);border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.12);width:min(340px,80vw);max-height:300px;overflow:auto;padding:6px}
.menu button{display:block;width:100%;text-align:start;border:0;background:transparent;border-radius:8px;padding:8px 10px;font-size:14px}
.menu button:hover{background:var(--sunk)}
.menu small{display:block;color:var(--muted)}
.prev{border-inline-start:1px solid var(--line);overflow:auto;padding:18px 20px 40px;background:var(--sunk)}
.prev h3{margin:0 0 8px;font-size:14px;color:var(--muted);font-weight:600}
.phone{width:100%;max-width:360px;margin:10px auto 0;background:#F7F5F1;color:#1C2E3A;border-radius:28px;box-shadow:0 0 0 8px #1d2a31,0 18px 40px rgba(0,0,0,.18);overflow:hidden;color-scheme:light}
.ph-top{display:flex;align-items:center;gap:8px;height:46px;padding:0 16px;border-bottom:1px solid #E7E3DC;font-weight:600;color:#013952;font-size:14px}
.ph-top::before{content:'';width:3px;height:18px;border-radius:2px;background:#00714e}
.ph-body{padding:14px;min-height:360px}
.p-h{font-size:20px;line-height:1.2;color:#013952;font-weight:700;margin:4px 0 4px}
.p-sub{color:#5F6A70;font-size:14px;margin:0 0 12px}
.card{background:#fff;border-radius:16px;box-shadow:0 1px 3px rgba(1,57,82,.07),0 4px 12px rgba(1,57,82,.04);overflow:hidden;margin-bottom:10px}
.card-h{display:flex;gap:10px;padding:13px 14px;align-items:flex-start}
.cb{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 2px #C9C2B6;flex:none;margin-top:2px}
.ct{font-weight:600;font-size:15.5px;line-height:1.3}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px;font-size:12.5px;color:#5F6A70}
.badge{font-weight:600}
.b-key{color:#013952}.b-first{color:#00714e}.b-urgent{color:#a4471d}.b-maybe{color:#6a5d9c}.b-smart{color:#5F6A70}
.cbody{border-top:1px solid #E7E3DC;padding:4px 14px 14px;font-size:14.5px}
.cbody h4{margin:12px 0 2px;font-size:12.5px;color:#5F6A70;font-weight:600}
.cbody p{margin:0}
.cbody ol,.cbody ul{margin:4px 0 0;padding-inline-start:20px}
.do{background:#EEF4E8;border-radius:10px;padding:2px 12px 10px;margin-top:10px}
.do h4{color:#00714e}
.call{background:#F4F1EB;border-radius:10px;padding:2px 12px 10px;margin-top:10px}
.lnk{display:inline-block;margin-top:12px;color:#013952;font-weight:600}
.num{width:30px;height:30px;border-radius:50%;background:#c5daaf;color:#013952;font-weight:700;display:grid;place-items:center;flex:none}
.sdo{color:#00714e;font-weight:600;margin-top:6px}
.quote{color:#013952;border-inline-start:3px solid #c5daaf;padding-inline-start:10px}
.tf{background:#E6EEF3;border-radius:4px;padding:0 3px}
.miss{color:#a4471d}
.kom{background:#EEF4E8;border-radius:16px;padding:12px 14px;font-size:14.5px}
.kom b{color:#013952}
.opt{background:#fff;border-radius:12px;padding:11px 12px;margin-top:6px;box-shadow:0 1px 3px rgba(1,57,82,.07);font-size:14.5px}
.tl{display:flex;gap:4px;background:#fff;border-radius:14px;padding:8px 4px;margin-bottom:12px;box-shadow:0 1px 3px rgba(1,57,82,.07)}
.tl span{flex:1;text-align:center;font-size:11px;color:#8E877C}
.tl span.on{color:#013952;font-weight:700}
.pv-note{font-size:13.5px;color:var(--muted);text-align:center;margin-top:14px}
.empty{color:var(--muted);font-size:15px}
.tabbar{display:none}
.tabbar button{flex:1;border:0;background:transparent;min-height:56px;font-weight:600;font-size:15px;color:var(--muted);border-top:3px solid transparent}
.tabbar button[aria-pressed=true]{color:var(--green);border-top-color:var(--green)}
.step{display:flex;gap:4px;margin-inline-start:auto}
.step .mini{white-space:nowrap}
.drawer{position:fixed;inset:0;z-index:50;background:rgba(10,20,25,.35);display:none;justify-content:flex-end}
.drawer.on{display:flex}
.panel{width:min(520px,100%);height:100%;background:var(--sheet);overflow:auto;padding:22px 22px 40px;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.panel h2{margin:0 0 4px;color:var(--navy);font-size:24px}
.panel>p{color:var(--muted);margin:0 0 16px}
.ch{border-top:1px solid var(--line);padding:12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.ch b{font-size:15px}
.ch .was{font-size:14px;color:var(--muted);text-decoration:line-through;overflow-wrap:anywhere}
.ch .now{font-size:14px;overflow-wrap:anywhere}
.steps{counter-reset:s;list-style:none;padding:0;margin:16px 0}
.steps li{counter-increment:s;position:relative;padding:12px 0 12px 44px;border-top:1px solid var(--line)}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:0;top:12px;width:30px;height:30px;border-radius:50%;background:var(--mint);color:var(--green);font-weight:700;display:grid;place-items:center}
.files{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,20,25,.35);display:none;place-items:center;padding:16px}
.modal.on{display:grid}
.box{background:var(--sheet);border-radius:20px;padding:22px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.box h2{margin:0 0 12px;color:var(--navy)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--sheet);padding:10px 18px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:70}
.toast.on{opacity:1}
.proto{font-size:13px;color:var(--muted);padding:8px 8px 0}
@media (max-width:1180px){.app{grid-template-rows:auto 1fr auto}.tabbar{display:flex;background:var(--sheet);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}.tabbar [data-view=nav]{display:none}.main{grid-template-columns:270px minmax(0,1fr)}.prev{display:none}.main[data-view=prev] .edit{display:none}.main[data-view=prev] .prev{display:block;border:0}}
@media (max-width:760px){.main{grid-template-columns:minmax(0,1fr)}.nav{display:none;border:0}.main[data-view=nav] .nav{display:block}.main[data-view=nav] .edit,.main[data-view=nav] .prev{display:none}.tabbar [data-view=nav]{display:block}.brand small{display:none}.saved{display:none}.top .btn.primary{margin-inline-start:auto}}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

.tool{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.tool button{border:1px solid var(--line);background:var(--sheet);border-radius:10px;padding:6px 12px;min-height:38px;font-size:14px;font-weight:600;color:var(--navy)}
.big{min-height:180px!important}
.wc{font-size:13.5px;color:var(--muted);margin-top:4px}
.wc.over{color:#b5562b;font-weight:600}
.toggle{display:flex;align-items:center;gap:10px;font-size:15px;padding:6px 0}
.toggle input{width:20px;height:20px;accent-color:var(--green)}
.checked{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.checked input{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:9px 12px;font-size:16px}
.kc{background:#F4F1EB;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:14px}
.kc b{display:block;color:#013952}
.kc span{display:block;color:#5F6A70}
.kc a,.kc .tel{color:#00714e;font-weight:600}
.vk{color:#a4471d;font-weight:600}
.flagdot{font-size:12px;font-weight:600;color:var(--warn-ink);background:var(--warn);border-radius:6px;padding:1px 6px;flex:none}
.cbody .call p{margin:0}
@media (max-width:1180px){.toast{bottom:84px}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Redaktør <small>Når familien kommer</small></div>
    <span class="saved" id="saved">Ingen endringer</span>
    <button class="mini" id="helpBtn">Veiledning</button>
    <button class="btn primary" id="pubBtn">Send<span class="hide-m"> endringer</span><span class="count" id="cnt">0</span></button>
  </header>
  <div class="main" id="main">
    <nav class="nav" id="nav" aria-label="Innhold"></nav>
    <section class="edit" id="edit"></section>
    <aside class="prev" id="prev"></aside>
  </div>
  <nav class="tabbar" aria-label="Visning"><button data-view="nav">1 Velg</button><button data-view="edit">2 Rediger</button><button data-view="prev">3 Slik ser det ut</button></nav>
</div>
<div class="drawer" id="drawer"><div class="panel" id="panel"></div></div>
<div class="modal" id="modal"><div class="box" id="box"></div></div>
<div class="tut" id="tut" role="dialog" aria-modal="true" aria-label="Veiledning"><div class="tut-hole" id="tutHole"></div><div class="tut-card" id="tutCard"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
(async()=>{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clone=o=>JSON.parse(JSON.stringify(o));
// Henter det som er publisert nå. Redaktøren jobber alltid oppå siste versjon.
const ORIG=await (async()=>{try{
    // Siste versjon rett fra GitHub hvis mulig, ellers den publiserte på nettsiden

function changes(){
  const out=[];
  new Set([...Object.keys(ORIG.t),...Object.keys(D.t)]).forEach(k=>{if(changedT(k))out.push({kind:'t',k,was:ORIG.t[k]||'',now:D.t[k]||''})});
  [['punkter','punkt'],['faser','fane'],['kontakter','kontakt']].forEach(([arr,lb])=>{
    D.s[arr].forEach(x=>{const o=ORIG.s[arr].find(y=>y.id===x.id);if(!o)out.push({kind:'s',label:'Ny '+lb+': '+(t(lb==='punkt'?'punkt.'+x.id+'.tittel':lb==='fane'?'fase.'+x.id+'.tittel':'kontakt.'+x.id+'.navn')||x.id)});
      else if(JSON.stringify(o)!==JSON.stringify(x))out.push({kind:'s',label:'Innstillinger endret: '+(t(lb==='punkt'?'punkt.'+x.id+'.tittel':lb==='fane'?'fase.'+x.id+'.tittel':'kontakt.'+x.id+'.navn')||x.id)})});
    const a=ORIG.s[arr].map(x=>x.id),b=D.s[arr].map(x=>x.id).filter(i=>a.includes(i));if(a.filter(i=>b.includes(i)).join()!==b.join())out.push({kind:'s',label:'Ny rekkefølge'});

}

function body(s){
  const blocks=String(s||'').split(/\n\s*\n/);let h='';
  blocks.forEach(b=>{const ls=b.split('\n').map(x=>x.trim()).filter(Boolean);if(!ls.length)return;
    const items=ls.filter(x=>/^[–-]\s/.test(x));
    if(items.length===ls.length){h+=`<ul>${ls.map(x=>`<li>${esc(x.replace(/^[–-]\s*/,''))}</li>`).join('')}</ul>`;return}
    ls.forEach(x=>{const m=x.match(/^(.*?)«([^»]+)»(.*)$/);
      if(m&&m[2].length>25)h+=`<div class="call"><h4>Dette kan du si:</h4><p>${m[1].trim()?esc(m[1].trim())+' ':''}«${esc(m[2])}»${esc(m[3])}</p></div>`;
      else if(/^[–-]\s/.test(x))h+=`<ul><li>${esc(x.replace(/^[–-]\s*/,''))}</li></ul>`;
      else{const lab=x.match(/^([^:]{3,28}):\s(.+)$/);h+=lab?`<p style="margin-top:10px"><b>${esc(lab[1])}:</b> ${esc(lab[2])}</p>`:`<p style="margin-top:10px">${esc(x)}</p>`}});
  });return h}

  return `<div class="card"><div class="card-h"><span class="cb"></span><div><div class="ct">${esc(t(k('tittel')))||'<span class="miss">Mangler tittel</span>'}</div>${meta?`<div class="meta">${meta}</div>`:''}</div></div>${open?`<div class="cbody">${body(t(k('tekst')))}${(p.kontakter||[]).map(kcard).join('')}${p.lenke?'<span class="lnk">Gå til nettside →</span>':''}</div>`:''}</div>`;
}
function renderPrev(){
  const pv=$('#prev');let b='',tog=false;
  const tl=fid=>`<div class="tl">${D.s.faser.filter(f=>f.status==='publisert'||f.id===fid).map(f=>`<span class="${f.id===fid?'on':''}">${esc(t('fase.'+f.id+'.kort'))}</span>`).join('')}</div>`;
  if(sel.type==='punkt'){const p=P(sel.id);tog=true;b=tl(p.fase)+`<div class="p-h">${esc(t('fase.'+p.fase+'.tittel'))}</div><p class="p-sub">${esc(t('fase.'+p.fase+'.undertekst'))}</p>`+itemCard(p,true)}
  else if(sel.type==='fase'){b=tl(sel.id)+`<div class="p-h">${esc(t('fase.'+sel.id+'.tittel'))}</div><p class="p-sub">${esc(t('fase.'+sel.id+'.undertekst'))}</p>`+D.s.punkter.filter(p=>p.fase===sel.id).map(p=>itemCard(p,false)).join('')}
  else if(sel.type==='q'){const s=Q(sel.id);b=`<div class="p-h">Hva gjelder dere?</div><b>${esc(t('sporsmal.'+s.id+'.tekst'))}</b>${s.svar.map(v=>`<div class="opt">${esc(t('sporsmal.'+s.id+'.'+v))}</div>`).join('')}`}
  else if(sel.type==='kontakt'){b=`<p class="p-sub">Slik vises kontakten nederst i et punkt:</p><div class="card"><div class="cbody" style="border:0">${kcard(sel.id)}</div></div>`}
  pv.innerHTML=`${phead(3,'Slik ser det ut i sjekklisten','Oppdateres mens du skriver')}<div class="phone"><div class="ph-top">Tønsberg kommune</div><div class="ph-body">${b}</div></div>`;
}
function setView(v){view=v;$('#main').dataset.view=v;document.querySelectorAll('.tabbar [data-view]').forEach(x=>x.setAttribute('aria-pressed',x.dataset.view===v));if(v==='prev')renderPrev();const el=v==='nav'?$('#nav'):v==='prev'?$('#prev'):$('#edit');el.scrollTop=0}
function renderAll(){renderNav();renderEdit();renderPrev();stamp()}

// ── Dialoger ──
function download(name,obj){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)+'\n'],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
function modal(h){$('#box').classList.remove('wide');$('#box').innerHTML=h;$('#modal').classList.add('on')}
const closeModal=()=>$('#modal').classList.remove('on');
function newItem(fase){
  modal(`<h2>Nytt punkt i «${esc(t('fase.'+fase+'.tittel'))}»</h2><div class="f"><div class="fh"><label for="nt">Tittel</label></div><input type="text" id="nt" placeholder="F.eks. Søk om skoleskyss"></div><p class="hint">Du skriver resten av punktet etterpå.</p><div class="bar" style="justify-content:flex-end;margin:16px 0 0"><button class="btn ghost" id="mNo">Avbryt</button><button class="btn primary" id="mYes">Lag punktet</button></div>`);
  $('#nt').focus();$('#mNo').onclick=closeModal;$('#mYes').onclick=()=>{const ti=$('#nt').value.trim();if(!ti){$('#nt').focus();return}
    const id=slug(ti,D.s.punkter.map(p=>p.id)),arr=D.s.punkter;let last=-1;arr.forEach((x,i)=>{if(x.fase===fase)last=i});arr.splice(last+1,0,{id,fase,status:'publisert'});D.t['punkt.'+id+'.tittel']=ti;
    save();closeModal();sel={type:'punkt',id};renderAll();setView('edit');toast('Punktet er laget');setTimeout(()=>{const f=document.querySelector(`[data-k="punkt.${id}.tekst"]`);f&&f.focus()},50)};
}
function newPhase(){
  modal(`<h2>Ny fase i reisen</h2><div class="f"><div class="fh"><label for="pk">Kort navn i tidslinjen</label></div><input type="text" id="pk" placeholder="F.eks. Jobb"></div><div class="f"><div class="fh"><label for="pt">Overskrift</label></div><input type="text" id="pt" placeholder="F.eks. Jobb og økonomi"></div><div class="f"><div class="fh"><label for="pa">Plassering</label></div><select id="pa"><option value="__first">Først</option>${D.s.faser.map((f,i)=>`<option value="${f.id}" ${i===D.s.faser.length-1?'selected':''}>Etter «${esc(t('fase.'+f.id+'.tittel'))}»</option>`).join('')}</select></div><div class="bar" style="justify-content:flex-end;margin:16px 0 0"><button class="btn ghost" id="mNo">Avbryt</button><button class="btn primary" id="mYes">Lag fasen</button></div>`);
  $('#pk').focus();$('#mNo').onclick=closeModal;$('#mYes').onclick=()=>{const kt=$('#pk').value.trim(),ti=$('#pt').value.trim();if(!kt||!ti){(kt?$('#pt'):$('#pk')).focus();return}
    const id=slug(kt,D.s.faser.map(f=>f.id)),pos=$('#pa').value,i=pos==='__first'?0:D.s.faser.findIndex(f=>f.id===pos)+1;D.s.faser.splice(i,0,{id,status:'publisert'});D.t['fase.'+id+'.kort']=kt;D.t['fase.'+id+'.tittel']=ti;
    save();closeModal();sel={type:'fase',id};renderAll();setView('edit');toast('Fasen er laget')};
}
function newContact(){
  modal(`<h2>Ny kontakt</h2><div class="f"><div class="fh"><label for="kn">Navn</label></div><input type="text" id="kn" placeholder="F.eks. Tønsberg tannklinikk"></div><div class="bar" style="justify-content:flex-end;margin:16px 0 0"><button class="btn ghost" id="mNo">Avbryt</button><button class="btn primary" id="mYes">Lag kontakten</button></div>`);
  $('#kn').focus();$('#mNo').onclick=closeModal;$('#mYes').onclick=()=>{const n=$('#kn').value.trim();if(!n){$('#kn').focus();return}const id=slug(n,D.s.kontakter.map(k=>k.id));D.s.kontakter.push({id});D.t['kontakt.'+id+'.navn']=n;save();closeModal();sel={type:'kontakt',id};renderAll();setView('edit')};
}
function openChanges(){
  const ch=changes(),tc=ch.filter(c=>c.kind==='t'),sc=ch.filter(c=>c.kind==='s');
  let h=`<div style="display:flex;justify-content:space-between;align-items:center"><h2>Endringer</h2><button class="mini" id="dc">Lukk</button></div>`;
  if(!ch.length)h+=`<p>Ingen endringer ennå. Det du gjør, lagres som utkast i denne nettleseren til du sender det til teknisk eier.</p>`;
  else{h+=`<p>${ch.length} ${ch.length===1?'endring':'endringer'}.${tc.length?' Ny og endret tekst blir KI-oversatt til '+NLANG+' språk når teknisk eier laster den opp.':''}</p>`;
    h+=ch.map((c,i)=>c.kind==='t'?`<div class="ch"><div><b>${esc(labelOf(c.k))}</b><div class="was">${esc(c.was)||'<i>tomt</i>'}</div><div class="now">${esc(c.now)||'<i>fjernet</i>'}</div></div><button class="mini" data-undo="${i}">Angre</button></div>`:`<div class="ch"><div><b>${esc(c.label)}</b></div><span></span></div>`).join('');
    h+=`<h2 style="margin-top:22px;font-size:20px">Send til teknisk eier</h2><ol class="steps"><li><b>Last ned endringsfila</b><div class="files"><button class="btn" id="dlFile">endringer-${today()}.json</button></div><div class="hint">Fila inneholder bare det du har endret.</div></li><li><b>Send fila til teknisk eier</b><div class="hint">På e-post eller Teams. Skriv gjerne én setning om hva du har endret og hvorfor.</div></li><li><b>Teknisk eier publiserer</b><div class="hint">Endringen KI-oversettes og publiseres samtidig. På andre språk enn norsk vises den med merket «Maskinoversatt» til en tolk har sett over den.</div></li></ol><details style="margin:6px 0 14px"><summary>For teknisk eier</summary><p class="hint">Hele filene, til bruk inntil mottaket er tatt i bruk. De erstatter <code>data/sprak/no.json</code> og <code>data/struktur.json</code>. Oversettelsene må oppdateres etterpå.</p><button class="btn" id="dlNo">Last ned no.json og struktur.json</button></details><button class="btn ghost" id="reset">Forkast alle endringer</button>`}
  $('#panel').innerHTML=h;$('#drawer').classList.add('on');$('#dc').onclick=()=>$('#drawer').classList.remove('on');
  $('#panel').querySelectorAll('[data-undo]').forEach(b=>b.onclick=()=>{const c=ch[+b.dataset.undo];if(c.was)D.t[c.k]=c.was;else delete D.t[c.k];save();renderAll();openChanges()});
  const dl=$('#dlFile');if(dl)dl.onclick=()=>{const tekst={};tc.forEach(c=>tekst[c.k]=c.now||null);const forrige={};tc.forEach(c=>{if(ORIG.t[c.k]!=null)forrige[c.k]=ORIG.t[c.k]});download('endringer-'+today()+'.json',{type:'endringer',versjon:2,laget:new Date().toISOString(),grunnlag:BASE,eldre_utkast:D.base!==BASE||undefined,tekster:tekst,forrige,struktur:sc.length?D.s:undefined});toast('Endringsfila er lastet ned')};
  const dn=$('#dlNo');if(dn)dn.onclick=()=>{download('no.json',(({base,at,avklart,...r})=>r.t)(D));download('struktur.json',D.s)};
  const r=$('#reset');if(r)r.onclick=()=>{modal(`<h2>Forkaste alle endringer?</h2><p>Utkastet slettes, og alt går tilbake til det som er publisert nå.</p><div class="bar" style="justify-content:flex-end;margin:16px 0 0"><button class="btn ghost" id="mNo">Avbryt</button><button class="btn primary" id="mYes">Forkast</button></div>`);$('#mNo').onclick=closeModal;$('#mYes').onclick=()=>{D=clone(ORIG);try{localStorage.removeItem(KEY)}catch(e){}closeModal();$('#drawer').classList.remove('on');renderAll();toast('Endringene er forkastet')}};
}
// ── Veiledning: mørklegger skjermen og fremhever én del om gangen. Vises hver gang redaktøren åpnes. ──
const TUT=[
 {t:'Velkommen til redaktøren',x:'Her endrer du innholdet i sjekklisten «Når familien kommer». Du skriver bare på norsk. Oversettelsene ordner teknisk eier og tolkene.<br><br>Redaktøren har <b>tre deler</b>. Vi viser deg dem én og én.'},
 {n:1,v:'nav',el:'#nav',t:'Velg hva du vil redigere',x:'Her er alt innholdet i sjekklisten. Trykk på et punkt for å redigere det.'},
 {n:1,v:'nav',el:'.navtabs',t:'Tre typer innhold',x:'<b>Sjekklisten:</b> fasene og punktene familien krysser av.<br><b>Kontakter:</b> telefonnumre og nettsider.<br><b>Spørsmål:</b> de tre spørsmålene på startsiden.'},
 {n:1,v:'nav',el:'#nav .mv',t:'Flytte et punkt',x:'Punktet du har valgt, har to piler. Med dem flytter du punktet opp eller ned i lista.'},
 {n:2,v:'edit',el:'#edit',t:'Her redigerer du',x:'Det du skriver her, lagres av seg selv i nettleseren din. Ingenting blir publisert før du sender endringene.'},
 {n:2,v:'edit',el:'[data-tut=punktet]',t:'Det familien leser',x:'Tittel, «Når og for hvem» og tekst. Hold teksten under 80 ord: først hvorfor det er viktig, så hva familien gjør.<br><br>Merket <span class="vis y">Vises for familien</span> viser hva familien ser.'},
 {n:2,v:'edit',el:'[data-tut=hvem]',t:'Det familien ikke ser',x:'Her bestemmer du hvem som får se punktet, og i hvilken fase det står. Familien ser det ikke som tekst.<br><br>Derfor er det merket <span class="vis n">Vises ikke for familien</span>.'},
 {n:3,v:'prev',el:'#prev',t:'Slik ser det ut i sjekklisten',x:'Her ser du punktet slik familien ser det på mobilen. Det oppdateres mens du skriver.'},
 {el:'#pubBtn',t:'Send endringene',x:'Når du er ferdig, trykker du her. Du laster ned en fil og sender den til teknisk eier på e-post eller Teams.<br><br>Du finner denne veiledningen igjen under «Veiledning» øverst.'}];
let TI=-1;
function tutorial(i){
  if(i===0){const p=D.s.punkter[0];if(p&&sel.type!=='punkt'){sel={type:'punkt',id:p.id};renderAll()}}
  TI=i;$('#tut').classList.add('on');const st=TUT[i],small=matchMedia('(max-width:1180px)').matches;
  if(st.v&&small)setView(st.v);else if(!small)setView('edit');
  let el=st.el?document.querySelector(st.el):null;
  if(el&&!el.getClientRects().length)el=null;
  if(el&&st.el.startsWith('[data-tut'))el.scrollIntoView({block:'nearest'});
  if(el&&st.el==='#nav .mv')el.closest('.nodew').scrollIntoView({block:'nearest'});
  const last=i===TUT.length-1;
  $('#tutCard').innerHTML=`<div class="tut-prog">${TUT.map((_,j)=>`<span class="${j<=i?'on':''}"></span>`).join('')}</div>${st.n?`<div class="tut-num"><span class="pnum">${st.n}</span>Del ${st.n} av 3</div>`:''}<h2>${st.t}</h2><p>${st.x}</p>
    <div class="bar" style="justify-content:space-between;margin:16px 0 0"><button class="btn ghost" id="tSkip">${last?'Lukk':'Hopp over'}</button><span style="display:flex;gap:8px">${i?'<button class="btn" id="tPrev">Tilbake</button>':''}<button class="btn primary" id="tNext">${last?'Kom i gang':'Neste'}</button></span></div>`;
  $('#tSkip').onclick=endTut;$('#tNext').onclick=()=>last?endTut():tutorial(i+1);const pv=$('#tPrev');if(pv)pv.onclick=()=>tutorial(i-1);
  requestAnimationFrame(()=>placeTut(el));$('#tNext').focus();
}
function placeTut(el){
  const hole=$('#tutHole'),card=$('#tutCard'),W=innerWidth,H=innerHeight,pad=6,cw=card.offsetWidth,ch=card.offsetHeight,g=14;
  if(!el){Object.assign(hole.style,{left:W/2+'px',top:H/2+'px',width:'0px',height:'0px'});Object.assign(card.style,{left:(W-cw)/2+'px',top:Math.max(12,(H-ch)/2)+'px'});return}
  const r=el.getBoundingClientRect(),x=Math.max(4,r.left-pad),y=Math.max(4,r.top-pad),w=Math.min(W-4,r.right+pad)-x,h=Math.min(H-4,r.bottom+pad)-y;
  Object.assign(hole.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
  const cl=(v,a,b)=>Math.min(Math.max(v,a),b);let L,T;
  if(W-(x+w)>=cw+g*2){L=x+w+g;T=cl(y,12,H-ch-12)}
  else if(x>=cw+g*2){L=x-cw-g;T=cl(y,12,H-ch-12)}
  else if(H-(y+h)>=ch+g*2){T=y+h+g;L=cl(x,12,W-cw-12)}
  else if(y>=ch+g*2){T=y-ch-g;L=cl(x,12,W-cw-12)}
  else{L=(W-cw)/2;T=H-ch-16}
  Object.assign(card.style,{left:L+'px',top:T+'px'});
}
function endTut(){TI=-1;$('#tut').classList.remove('on');if(matchMedia('(max-width:760px)').matches)setView('nav')}
addEventListener('resize',()=>{if(TI>=0)tutorial(TI)});
document.addEventListener('keydown',e=>{if(TI<0)return;if(e.key==='Escape')endTut();if(e.key==='ArrowRight'&&TI<TUT.length-1)tutorial(TI+1);if(e.key==='ArrowLeft'&&TI>0)tutorial(TI-1)});

// ── Hendelser ──
const cur=()=>sel.type==='punkt'?P(sel.id):sel.type==='fase'?F(sel.id):sel.type==='kontakt'?K(sel.id):sel.type==='q'?Q(sel.id):null;
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b||b.closest('#box')&&!b.dataset.sel)return;const c=cur();
  if(b.dataset.navtab){const tb=b.dataset.navtab;navTab=tb;q='';if(tabOf(sel.type)!==tb){sel=tb==='kontakt'?{type:'kontakt',id:D.s.kontakter[0].id}:tb==='q'?{type:'q',id:D.s.sporsmal[0].id}:{type:'punkt',id:D.s.punkter[0].id}}renderAll();return}
  if(b.dataset.sel){sel=JSON.parse(b.dataset.sel);navTab=tabOf(sel.type);renderAll();setView(view==='prev'&&!b.closest('.nav')?'prev':'edit');return}
  if(b.dataset.view){setView(b.dataset.view);return}
  if(b.dataset.status&&c){c.status=b.dataset.status;save();renderAll();return}
  if(b.dataset.move&&c){const arr=D.s.punkter,same=arr.filter(x=>x.fase===c.fase),o=same[same.indexOf(c)+ +b.dataset.move];if(!o)return;const i=arr.indexOf(c),j=arr.indexOf(o);[arr[i],arr[j]]=[arr[j],arr[i]];save();renderAll();return}
  if(b.dataset.fmove&&c){const arr=D.s.faser,i=arr.indexOf(c),j=i+ +b.dataset.fmove;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();renderAll();return}
  if(b.dataset.cond&&c){const v=b.dataset.cond,a=c.vises_hvis||[],qid=v.split('=')[0];c.vises_hvis=a.includes(v)?a.filter(x=>x!==v):[...a.filter(x=>!x.startsWith(qid+'=')),v];if(!c.vises_hvis.length)delete c.vises_hvis;save();renderEdit();renderPrev();renderNav();return}
  if(b.dataset.kon&&c){const a=c.kontakter||[],v=b.dataset.kon;c.kontakter=a.includes(v)?a.filter(x=>x!==v):[...a,v];if(!c.kontakter.length)delete c.kontakter;b.setAttribute('aria-pressed',(c.kontakter||[]).includes(v));save();renderPrev();renderNav();return}
  if(b.dataset.ins){const ta=document.querySelector(`#edit textarea[data-k$=".tekst"]`);const p=ta.selectionStart??ta.value.length,pre=ta.value.slice(0,p),nl=pre&&!pre.endsWith('\n')?'\n':'';
    const ins=b.dataset.ins==='list'?nl+'– ':nl+'Ring og si: «»';ta.value=pre+ins+ta.value.slice(p);const pos=p+ins.length-(b.dataset.ins==='call'?1:0);ta.focus();ta.setSelectionRange(pos,pos);ta.dispatchEvent(new Event('input',{bubbles:true}));return}
  if(b.dataset.open){openCard=b.dataset.open==='1';renderPrev();return}
  if(b.dataset.add){newItem(b.dataset.add);return}
  if(b.dataset.addfase){newPhase();return}
  if(b.dataset.addk){newContact();return}
  if(b.dataset.del){const arr=b.dataset.del==='punkt'?D.s.punkter:D.s.faser,o=arr.find(x=>x.id===sel.id),pre=(b.dataset.del==='punkt'?'punkt.':'fase.')+sel.id+'.';const next=b.dataset.del==='punkt'?{type:'fase',id:o.fase}:{type:'fase',id:(arr[arr.indexOf(o)-1]||arr[1]).id};arr.splice(arr.indexOf(o),1);Object.keys(D.t).filter(k=>k.startsWith(pre)).forEach(k=>delete D.t[k]);save();sel=next;renderAll();toast('Utkastet er slettet');return}
  if(b.id==='pubBtn'){openChanges();return}
  if(b.id==='helpBtn'){tutorial(0);return}
});
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset.k){const k=el.dataset.k;if(el.value.trim())D.t[k]=el.value;else delete D.t[k];if(el.tagName==='TEXTAREA')grow(el);
    if(k.endsWith('.tekst')&&k.startsWith('punkt.')){const w=words(el.value),wc=$('#wc');wc.textContent=wcHtml(w);wc.classList.toggle('over',w>MAXW)}
    const f=el.closest('.f');let st=f.querySelector('.stale');const show=changedT(k)&&ORIG.t[k];if(show&&!st){f.insertAdjacentHTML('beforeend',stale(k))}else if(!show&&st)st.remove();
    save();renderPrev();clearTimeout(el._n);el._n=setTimeout(renderNav,400);return}
  if(el.dataset.kset){const c=K(sel.id);if(el.value.trim())c[el.dataset.kset]=el.value.trim();else delete c[el.dataset.kset];save();renderPrev();return}
});
document.addEventListener('change',e=>{const el=e.target,c=cur();if(!el.dataset.set||!c)return;const f=el.dataset.set;
  if(el.type==='checkbox'){if(el.checked)c[f]=true;else delete c[f]}else if(el.value.trim())c[f]=el.value.trim();else delete c[f];
  if(f==='fase'){const arr=D.s.punkter;arr.splice(arr.indexOf(c),1);let last=-1;arr.forEach((x,i)=>{if(x.fase===c.fase)last=i});arr.splice(last+1,0,c)}
  save();renderAll()});
$('#drawer').addEventListener('click',e=>{if(e.target.id==='drawer')$('#drawer').classList.remove('on')});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#drawer').classList.remove('on');closeModal()}});
renderAll();setView(view);
addEventListener('resize',()=>{if(view==='nav'&&!matchMedia('(max-width:760px)').matches)setView('edit')});
try{if(baseChanged)modal(`<h2>Det er publisert nye endringer</h2><p>Innholdet er oppdatert siden du startet utkastet ditt. Utkastet ditt er beholdt, men sjekk at du ikke overskriver noe som er endret i mellomtiden.</p><div class="bar" style="justify-content:flex-end;margin:16px 0 0"><button class="btn ghost" id="mNo">Start på nytt fra det publiserte</button><button class="btn primary" id="mYes">Fortsett på utkastet</button></div>`),$('#mYes').onclick=()=>{closeModal()},$('#mNo').onclick=()=>{D=clone(ORIG);D.base=BASE;try{localStorage.removeItem(KEY)}catch(e){}closeModal();renderAll()};
  else tutorial(0)}catch(e){}
})();
</script>
